ServerName          "FTP"
ServerType          standalone
DefaultServer       on
Port                21
UseIPv6             off
Umask               022
MaxInstances        30
User                proftpd
Group               proftpd

SystemLog           /dev/stderr
DefaultRoot         ~
RequireValidShell   off
AllowOverwrite      on

PassivePorts        50000 50100
MasqueradeAddress   0.0.0.0