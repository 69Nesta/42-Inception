
services:
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/usr/share/nginx/html:ro
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    healthcheck:
      test: nginx -t
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    network:
      - fontend

  mariadb:
    container_name: mariadb
    environment:
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER is required}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE is required}
    build:
      context: ./requirements/mariadb/
      dockerfile: ./Dockerfile
    volumes:
      - db_volume:/var/lib/mysql
    restart: always
    network:
      - backend

volumes:
  web_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/goinfre/data/web_volume
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/goinfre/data/db_volume

networks:
  fontend:
  backend:
