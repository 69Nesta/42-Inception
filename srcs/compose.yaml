
services:
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/usr/share/nginx/html
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    restart: always
    healthcheck:
      test: nginx -t
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb/
      dockerfile: ./Dockerfile
    volumes:
      - db_volume:/var/lib/mysql
    restart: always

volumes:
  web_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/web_volume
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/db_volume

networks:
  fontend:
  backend:
