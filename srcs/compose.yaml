services:
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/var/www/html:ro
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    healthcheck:
      test: nginx -t
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception_frontend
    depends_on:
      wordpress:
        condition: service_healthy

  db:
    container_name: mariadb
    hostname: database
    environment:
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
    build:
      context: ./requirements/mariadb/
      dockerfile: ./Dockerfile
    volumes:
      - db_volume:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent 2>/dev/null;"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - inception_backend

  wordpress:
    container_name: wordpress
    environment:
      # Wordpress database
      DB_HOST: ${DB_HOST:+database}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Wordpress admin user
      WORDPRESS_SITE_TITLE: ${WORDPRESS_SITE_TITLE:?WORDPRESS_SITE_TITLE is required}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?WORDPRESS_ADMIN_USER is required}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:?WORDPRESS_ADMIN_EMAIL is required}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?WORDPRESS_ADMIN_PASSWORD is required}
      # Wordpress default user
      WORDPRESS_USER: ${WORDPRESS_USER:?WORDPRESS_USER is required}
      WORDPRESS_EMAIL: ${WORDPRESS_EMAIL:?WORDPRESS_EMAIL is required}
      WORDPRESS_PASSWORD: ${WORDPRESS_PASSWORD:?WORDPRESS_PASSWORD is required}
      # Wordpress default post
      WORDPRESS_DEFAULT_POST_TITLE: ${WORDPRESS_DEFAULT_POST_TITLE:?WORDPRESS_DEFAULT_POST_TITLE is required}
      WORDPRESS_DEFAULT_POST_CONTENT: ${WORDPRESS_DEFAULT_POST_CONTENT:?WORDPRESS_DEFAULT_POST_CONTENT is required}
      WORDPRESS_DEFAULT_POST_STATUS: ${WORDPRESS_DEFAULT_POST_STATUS:?WORDPRESS_DEFAULT_POST_STATUS is required}
      WORDPRESS_DEFAULT_POST_AUTHOR: ${WORDPRESS_DEFAULT_POST_AUTHOR:?WORDPRESS_DEFAULT_POST_AUTHOR is required}
      # Redis plugin secrets
      WORDPRESS_REDIS_HOST: ${WORDPRESS_REDIS_HOST:?WORDPRESS_REDIS_HOST is required}
      WORDPRESS_REDIS_PORT: ${WORDPRESS_REDIS_PORT:?WORDPRESS_REDIS_PORT is required}
      WORDPRESS_REDIS_DATABASE: ${WORDPRESS_REDIS_DATABASE:?WORDPRESS_REDIS_DATABASE is required}
      WORDPRESS_REDIS_PREFIX: ${WORDPRESS_REDIS_PREFIX:?WORDPRESS_REDIS_PREFIX is required}
      WORDPRESS_REDIS_TIMEOUT: ${WORDPRESS_REDIS_TIMEOUT:?WORDPRESS_REDIS_TIMEOUT is required}
      WORDPRESS_REDIS_READ_TIMEOUT: ${WORDPRESS_REDIS_READ_TIMEOUT:?WORDPRESS_REDIS_READ_TIMEOUT is required}
    build:
      context: ./requirements/wordpress/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/var/www/html
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inception_frontend
      - inception_backend

  redis:
    container_name: redis
    build:
      context: ./requirements/bonus/redis/
      dockerfile: ./Dockerfile
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping" ]
      interval: 3s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - inception_backend

  ftp:
    container_name: ftp
    environment:
      FTP_USER: ${FTP_USER:?FTP_USER is required}
      FTP_PASSWORD: ${FTP_PASSWORD:?FTP_PASSWORD is required}
      FTP_UID: 0
    build:
      context: ./requirements/bonus/ftp/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/srv/ftp
    restart: always
    ports:
      - "21:21"
    networks:
      - inception_backend

volumes:
  web_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/web_volume
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/db_volume

networks:
  inception_frontend:
    driver: bridge
  inception_backend:
    driver: bridge
