
services:
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/usr/share/nginx/html:ro
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    healthcheck:
      test: nginx -t
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    expose:
      - 80:80
      - 443:433
    networks:
      - inception_frontend

  db:
    container_name: mariadb
    environment:
      MARIADB_USER: ${DB_USER:?MARIADB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?MARIADB_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:?MARIADB_DATABASE is required}
    build:
      context: ./requirements/mariadb/
      dockerfile: ./Dockerfile
    volumes:
      - db_volume:/var/lib/mysql
    restart: always
    networks:
      - inception_backend

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress/
      dockerfile: ./Dockerfile
    volumes:
      - web_volume:/var/www/html
    restart: always
    networks:
      - inception_frontend
      - inception_backend

volumes:
  web_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/goinfre/data/web_volume
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/goinfre/data/db_volume

networks:
  inception_frontend:
    driver: bridge
  inception_backend:
    driver: bridge
